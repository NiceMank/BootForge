name: CI & Multiplatform Releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb & portable tar.gz)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: /usr/lib/python3/dist-packages:.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system & GTK4 runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-pytest python3-cryptography \
            util-linux 7zip parted gdisk dosfstools ntfs-3g exfatprogs e2fsprogs \
            desktop-file-utils xvfb

      - name: Syntax check, unit tests & GTK4 smoke test
        run: |
          python3 -m compileall -q bootforge_ui bootforge_win engine
          pytest -v
          desktop-file-validate data/io.github.nicemank.BootForge.desktop
          BOOTFORGE_NO_STARTUP_UPDATE=1 xvfb-run -a python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); from gi.repository import Adw, GLib; from bootforge_ui.window import BootForgeWindow; app = Adw.Application(application_id='io.github.nicemank.BootForge.CI'); app.connect('activate', lambda a: (BootForgeWindow(a), GLib.timeout_add(200, a.quit))); app.run([])"

      - name: Build .deb and portable tarball
        run: |
          bash packaging/build_deb.sh
          dpkg-deb --info release/*.deb

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: bootforge-linux-packages
          path: |
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows (Setup .exe & portable .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-win.txt pytest cryptography

      - name: Run Windows test suite & PyQt6 smoke test
        run: |
          pytest -v
          $env:BOOTFORGE_NO_STARTUP_UPDATE = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PyQt6.QtWidgets import QApplication; from bootforge_win.window import BootForgeMainWindow; app = QApplication([]); w = BootForgeMainWindow(); w.close(); app.processEvents()"

      - name: Build Windows binary and portable ZIP
        run: |
          python packaging/build_windows.py

      - name: Setup NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
              echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install nsis -y
              echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Compile NSIS Installer (.exe)
        shell: pwsh
        run: |
          $ver = python -c "import sys; sys.path.insert(0, '.'); from bootforge_ui import __version__; print(__version__)"
          & makensis "-DVERSION=$ver" packaging\win_installer.nsi
          Get-ChildItem -Path release

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: bootforge-windows-packages
          path: |
            release/*-win64-setup.exe
            release/*-win64-portable.zip
          if-no-files-found: error

  publish-release:
    name: Publish Official Multiplatform Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: bootforge-linux-packages
          path: dist-release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: bootforge-windows-packages
          path: dist-release

      - name: Generate Checksums, Signed Update Manifest & Release Notes
        id: notes
        env:
          BOOTFORGE_SIGNING_KEY: ${{ secrets.BOOTFORGE_SIGNING_KEY }}
        run: |
          python3 -m pip install --quiet cryptography
          python3 packaging/sign_release.py --dist-dir dist-release --tag "${{ github.ref_name }}" --require-signature
          cd dist-release
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "CHECKSUMS<<EOF" >> $GITHUB_ENV
          cat SHA256SUMS.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BootForge ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist-release/*
          body: |
            ## 🚀 BootForge ${{ github.ref_name }} — Studio USB Bootable & Multi-Boot (Linux & Windows)

            BootForge est une suite complète de création et gestion de clés USB bootables pour **Linux** et **Windows 10/11**, offrant une double compatibilité **Flash Direct (Rufus)** et **Multi-Boot dynamique (Ventoy)** avec un basculement ergonomique **Mode Simple** (grand public) et **Mode Avancé** (utilisateurs chevronnés).

            ### 📦 Paquets disponibles au téléchargement

            #### 🐧 Linux (Ubuntu, Debian, Linux Mint, Pop!_OS, Fedora, Arch...)
            - **`bootforge_${{ env.RELEASE_VERSION }}_all.deb`** : Paquet d'installation natif Debian/Ubuntu avec intégration bureau, icônes hicolor et raccourcis.
            - **`BootForge-${{ env.RELEASE_VERSION }}-linux.tar.gz`** : Archive portable autonome prête à l'emploi (`./bootforge`).

            #### 🪟 Windows (Windows 10 / Windows 11 - 64 bits)
            - **`BootForge-${{ env.RELEASE_VERSION }}-win64-setup.exe`** : Programme d'installation Windows classique avec raccourcis Menu Démarrer et Bureau.
            - **`BootForge-${{ env.RELEASE_VERSION }}-win64-portable.zip`** : Version portable sans installation, à décompresser et lancer directement (`BootForge.exe`).

            ---

            ### ✨ Fonctionnalités clés

            1. **Flash Direct (Compatible Rufus)** :
               - Partitionnement GPT (UEFI) ou MBR (BIOS hérité / CSM).
               - Système de fichiers NTFS + EFI:NTFS, FAT32 avec découpe automatique des gros `install.wim` (> 4 Go), exFAT ou mode Image brute (DD).
               - **Suite Windows 11** : Contournement matériel TPM 2.0 / Secure Boot / RAM 4 Go, création de compte local (contournement compte Microsoft obligatoire), désactivation BitLocker automatique et injection de pilotes `$WinPEDriver$`.

            2. **Multi-Boot (Compatible Ventoy)** :
               - Placez autant d'images ISO que souhaité sur une même clé USB sans formatage répété.
               - Support Secure Boot (partition VTOYEFI).
               - Personnalisation graphique et menu `ventoy.json` (alias par ISO, démarrage par défaut, contournements Windows 11).

            3. **Boîte à outils USB complète** :
               - Calculateur d'empreintes d'intégrité en streaming (`SHA-256`, `SHA-1`, `MD5`).
               - Test de débit séquentiel réel (Mo/s).
               - Détection de secteurs défectueux (`badblocks` avec avertissement rouge destructeur).
               - Remise à zéro d'usine (effacement des signatures MBR/GPT et reformatage FAT32/exFAT).
               - Sauvegarde et restauration d'image disque complète (`.img` / `.img.gz`).
               - Test instantané en machine virtuelle QEMU (UEFI OVMF ou BIOS hérité).

            4. **Catalogue officiel d'OS** :
               - Téléchargement direct en un clic d'images vérifiées : Windows 11, Ubuntu 24.04 LTS, Linux Mint, Debian 12, Fedora, Arch Linux, Kali Linux, Proxmox VE, Clonezilla, SystemRescue, etc.

            5. **Interface bilingue instantanée / Instant Bilingual UI (FR 🇫🇷 / EN 🇬🇧)** :
               - Basculement instantané de langue en direct via le bouton de la barre de titre, sans redémarrage requis.
               - Instant on-the-fly language switching from the HeaderBar without requiring an application restart.

            ---

            ### 🔒 Intégrité des binaires (SHA-256)

            ```text
            ${{ env.CHECKSUMS }}
            ```
